# --- Server ---
server.port=8000

# --- PostgreSQL (authoritative orders/users) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce?sslmode=require&sslfactory=org.postgresql.ssl.NonValidatingFactory
spring.datasource.username=ecom
spring.datasource.password=ecom
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# --- MongoDB (product catalog) ---
spring.data.mongodb.uri=mongodb://localhost:27017/ecommerce

# --- App settings (all overridable via env vars, e.g. SYNC_STRATEGY=outbox) ---
app.elasticsearch-url=http://localhost:9200
app.es-index=orders
app.sync-strategy=dual_write
app.outbox-poll-seconds=2
app.polling-interval-seconds=15
app.outbox-max-attempts=10
app.repair-loop-seconds=10
app.cors-origins=http://localhost:5173,http://127.0.0.1:5173

# --- Logging ---
logging.level.com.ecommerce=INFO
