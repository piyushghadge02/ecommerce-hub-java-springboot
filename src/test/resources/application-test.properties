# Isolated test resources — never clobber the demo `ecommerce` data.
server.port=0

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_test
spring.datasource.username=ecom
spring.datasource.password=ecom
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.data.mongodb.uri=mongodb://localhost:27017/ecommerce_test

app.elasticsearch-url=http://localhost:9200
app.es-index=orders_test
app.sync-strategy=dual_write
app.outbox-poll-seconds=1
app.polling-interval-seconds=1
app.outbox-max-attempts=3
app.repair-loop-seconds=60
app.cors-origins=http://localhost:5173,http://127.0.0.1:5173

logging.level.com.ecommerce=WARN
